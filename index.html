  .stat .unit{font-family:"PingFang SC",sans-serif;font-weight:400;font-size:15px;line-height:21px;color:#fff;opacity:.8;margin-top:6px;white-space:nowrap;}
  html.static *, html.static *::before, html.static *::after{animation:none !important;transition:none !important;}
  html.static section{opacity:1 !important;transform:none !important;}
</style>
<script>if(location.search.indexOf('static')>=0){document.documentElement.classList.add('static');}</script>

<script>
  var DESIGN_W=1920, stage=document.getElementById('stage'), wrap=document.getElementById('scaleWrap');
  function fit(){var s=Math.min(1,innerWidth/DESIGN_W);var secs=stage.querySelectorAll('section');var last=secs[secs.length-1];var H=last.offsetTop+last.offsetHeight;stage.style.transform='translateX(-50%) scale('+s+')';wrap.style.height=(H*s)+'px';}
  addEventListener('resize',fit);addEventListener('load',fit);fit();
  var STATIC=document.documentElement.classList.contains('static');
  // 可逆入场：进入视口播放、完全离开视口复位，再次滚到重新播放
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(STATIC)return;var t=e.target;
    if(e.isIntersecting){t.classList.add('reveal');if(t.classList.contains('once'))t.dataset.done='1';}
    else if(!(t.classList.contains('once')&&t.dataset.done)){t.classList.remove('reveal');}});},{threshold:0.08,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('section').forEach(function(s){io.observe(s);});
  function revealCheck(){if(STATIC)return;document.querySelectorAll('section').forEach(function(s){var r=s.getBoundingClientRect();var inview=r.top<innerHeight*0.94&&r.bottom>0;
    if(inview){s.classList.add('reveal');if(s.classList.contains('once'))s.dataset.done='1';}
    else if(!(s.classList.contains('once')&&s.dataset.done)){s.classList.remove('reveal');}});}
  addEventListener('scroll',revealCheck,{passive:true});revealCheck();
  (function(){var dd=document.getElementById('ddSpace');if(!dd)return;
    dd.querySelector('.dd-btn').addEventListener('click',function(e){e.stopPropagation();dd.classList.toggle('open');});
    document.addEventListener('click',function(e){if(!dd.contains(e.target))dd.classList.remove('open');});
    if(location.search.indexOf('dd=1')>=0){dd.classList.add('open');}})();
  if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t){setTimeout(function(){window.scrollTo(0,t.offsetTop);revealCheck();},60);}}
</script>
